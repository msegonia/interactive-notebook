<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page not found · The Interactive Notebook</title>
<style>
  /* the same notebook look as the app: ruled paper, red margin, navy text */
  :root { --paper: #F7F9FC; --rule: #E4EBF4; --margin: #F2A0A0; --navy: #1E3A8A; --navy-t: #0F1C4D; --muted: #5B6577; --line: #DFE6F0; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: 'Lexend', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #26324B;
    background-color: var(--paper); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 29px, var(--rule) 29px, var(--rule) 30px); }
  .page { position: relative; max-width: 480px; min-height: 100vh; margin: 0 auto; padding: 70px 22px 40px 60px; }
  .page::before { content: ''; position: absolute; top: 0; bottom: 0; left: 38px; width: 2px; background: var(--margin); }
  .card { background: rgba(255, 255, 255, 0.92); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: 0 2px 10px rgba(15, 28, 77, 0.06); }
  .big { font-size: 46px; font-weight: 800; color: var(--navy-t); line-height: 1; }
  h1 { margin: 10px 0 6px; font-size: 24px; color: var(--navy-t); }
  p { margin: 0 0 10px; font-size: 15px; line-height: 1.55; color: var(--muted); }
  a.btn { display: block; margin-top: 16px; padding: 14px; border-radius: 14px; background: var(--navy); color: #FFFFFF; text-align: center; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <main class="page">
    <div class="card">
      <div class="big">404</div>
      <h1>This page isn’t in the notebook</h1>
      <p>The address may be mistyped, or the page was moved.</p>
      <p>Wala ang pahinang ito. Bumalik sa simula ng Notebook.</p>
      <a class="btn" href="https://msegonia.github.io/interactive-notebook/">Open The Interactive Notebook</a>
    </div>
  </main>
</body>
</html>
